<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Company - JobTracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #1f2937;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
        }
        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        button {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        button[type="submit"] {
            background-color: #2563eb;
            color: white;
        }
        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }
        button[type="button"] {
            background-color: #6b7280;
            color: white;
        }
        button[type="button"]:hover {
            background-color: #4b5563;
        }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <div class="container">
        <h2>Add Company Information</h2>
        
        <form id="companyForm" onsubmit="addCompanyInfo(event)">
            <div class="form-group">
                <label for="companyName">Company Name *</label>
                <input type="text" id="companyName" required>
            </div>

            <div class="form-group">
                <label for="location">Location *</label>
                <input type="text" id="location" placeholder="e.g., Bangalore, India" required>
            </div>

            <div class="form-group">
                <label for="industry">Industry *</label>
                <select id="industry" required>
                    <option value="">-- Select Industry --</option>
                    <option value="Technology">Technology</option>
                    <option value="Finance">Finance</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                    <option value="Retail">Retail</option>
                    <option value="Manufacturing">Manufacturing</option>
                    <option value="Consulting">Consulting</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="avgPackage">Average Package (LPA) *</label>
                <input type="number" id="avgPackage" step="0.1" min="0" placeholder="e.g., 12.5" required>
            </div>

            <div class="form-group">
                <label for="notes">Notes (Research, Culture, Interview Process, etc.) *</label>
                <textarea id="notes" rows="6" placeholder="Add important details about the company..." required></textarea>
            </div>

            <div class="button-group">
                <button type="submit">Save Company Info</button>
                <button type="button" onclick="cancelEdit()">Cancel</button>
            </div>
        </form>
    </div>

    <script src="/company.js"></script>
    <script>
        function cancelEdit() {
            localStorage.removeItem('editCompanyId');
            window.location.href = '/companies';
        }
    </script>
</body>
</html>
